<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>무한 노가다 RPG</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#10131c;color:#f3f4f6;font-family:system-ui,sans-serif}h1{font-size:24px;margin:0 0 4px}.muted{color:#a8b0c2;font-size:13px}.panel{background:#1b2130;border:1px solid #343d52;border-radius:16px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#252d40;border-radius:10px;padding:10px;font-size:13px}.stat b{display:block;font-size:20px;margin-top:4px}.big{font-size:28px;font-weight:800}.bar{height:10px;background:#343d52;border-radius:9px;overflow:hidden}.fill{height:100%;background:#65e6a5;width:0%;transition:width .15s}button{border:0;border-radius:11px;padding:13px 14px;min-height:46px;font-weight:750;font-size:15px;background:#39445b;color:#fff}button:disabled{opacity:.4}.primary{background:#a7f3d0;color:#10251c;width:100%;margin-top:12px}.shop{display:flex;justify-content:space-between;align-items:center;gap:10px}.shop button{min-width:82px}.monster{font-size:62px}.center{text-align:center}.log{min-height:22px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
</style></head><body>
<h1>⚒️ 무한 노가다 RPG</h1><div class="muted">몬스터를 잡고 장비를 강화해서 끝없이 성장하자!</div>
<div class="panel"><div class="big" id="coins">🪙 0 G</div><div class="stats"><div class="stat">레벨<b id="lv">1</b></div><div class="stat">공격력<b id="atk">1</b></div><div class="stat">총 처치<b id="kills">0</b></div></div><div class="row" style="margin-top:14px"><span>경험치</span><span id="xpt">0 / 20</span></div><div class="bar"><div class="fill" id="xpb"></div></div></div>
<div class="panel"><b>👾 몬스터 선택</b><div class="muted" style="margin:6px 0 10px">원하는 몬스터를 골라 사냥하자! 강한 몬스터일수록 체력이 높아.</div><select id="pick" style="width:100%;padding:13px;border-radius:10px;background:#252d40;color:white;border:1px solid #49536a;font-size:16px"><option value="0">🟢 초록 슬라임 — HP 10</option><option value="1">🐌 돌 껍질 달팽이 — HP 50</option><option value="2">👻 떠돌이 유령 — HP 100</option><option value="3">🦇 어둠 박쥐 — HP 180</option><option value="4">🐉 미니 드래곤 — HP 300</option><option value="5">💀 해골 기사 — HP 500</option><option value="6">👹 지옥의 악마 — HP 800</option></select></div>\n<div class="panel center"><div class="monster" id="monster">🟢</div><h2 id="mname" style="margin:4px 0">초록 슬라임</h2><div class="muted">처치 보상: <span id="reward">7</span> G</div><div id="hpt" style="font-size:13px;margin:14px 0 5px">체력 10 / 10</div><div class="bar"><div class="fill" id="hpb"></div></div><button class="primary" id="hit">⚔️ 공격하기</button><div class="muted log" id="log" aria-live="polite">슬라임을 공격해서 돈을 모으자!</div></div>
<h3>🛒 장비 상점</h3>
<div class="panel shop"><div><b>⚔️ 공격력 강화</b><div class="muted">공격력 +1</div><div id="upcost" style="font-size:13px;margin-top:5px">가격: 15 G</div></div><button id="up">강화</button></div>
<div class="panel shop"><div><b>🤖 자동 공격</b><div class="muted">초당 1회 자동 공격</div><div id="autocost" style="font-size:13px;margin-top:5px">가격: 100 G</div></div><button id="auto">구매</button></div>
<div class="panel shop"><div><b>💰 골드 2배</b><div class="muted">처치 보상 2배</div><div id="doublecost" style="font-size:13px;margin-top:5px">가격: 250 G</div></div><button id="double">구매</button></div>
<div class="panel"><div class="shop"><b>🏆 성장 기록</b><button id="reset">초기화</button></div><div class="muted" id="stats" style="margin-top:10px">아직 처치 기록이 없어!</div></div>
<script>
(()=>{let gold=0,lv=1,atk=1,xp=0,kills=0,hp=10,mhp=10,auto=false,dbl=false,upcost=15,selected=0;const $=id=>document.getElementById(id);const names=[['🟢','초록 슬라임',10,5],['🐌','돌 껍질 달팽이',50,12],['👻','떠돌이 유령',100,22],['🦇','어둠 박쥐',180,35],['🐉','미니 드래곤',300,60],['💀','해골 기사',500,100],['👹','지옥의 악마',800,160]];function reward(){return Math.floor(names[selected][3]*(dbl?2:1))}function say(t){$('log').textContent=t}function spawn(){mhp=names[selected][2];hp=mhp;$('monster').textContent=names[selected][0];$('mname').textContent=names[selected][1];$('pick').value=String(selected);render()}function hit(){hp-=atk;if(hp<=0){let rew=reward();gold+=rew;kills++;xp+=10+lv*2;let ups=0;while(xp>=lv*20){xp-=lv*20;lv++;ups++}spawn();say(ups?'🎉 레벨 업! 현재 레벨 '+lv+'!':'💥 처치 성공! +'+rew+' G · 경험치 획득!')}else say('⚔️ '+atk+' 데미지! 몬스터 체력 '+hp+'/'+mhp);render()}function render(){$('coins').textContent='🪙 '+Math.floor(gold)+' G';$('lv').textContent=lv;$('atk').textContent=atk;$('kills').textContent=kills;$('xpt').textContent=xp+' / '+(lv*20);$('xpb').style.width=Math.min(100,xp/(lv*20)*100)+'%';$('hpt').textContent='체력 '+Math.max(0,hp)+' / '+mhp;$('hpb').style.width=Math.max(0,hp/mhp*100)+'%';$('reward').textContent=reward();$('upcost').textContent='가격: '+upcost+' G';$('up').disabled=gold<upcost;$('autocost').textContent=auto?'구매 완료':'가격: 100 G';$('auto').disabled=auto||gold<100;$('auto').textContent=auto?'활성화됨':'구매';$('doublecost').textContent=dbl?'구매 완료':'가격: 250 G';$('double').disabled=dbl||gold<250;$('double').textContent=dbl?'활성화됨':'구매';$('stats').textContent='누적 골드 획득: '+Math.floor(gold)+' G · 총 처치: '+kills+' · 현재 레벨: '+lv} $('pick').onchange=()=>{selected=Number($('pick').value);spawn();say(names[selected][1]+' 선택! 체력 '+mhp+'로 시작해.')};$('hit').onclick=hit;$('up').onclick=()=>{if(gold>=upcost){gold-=upcost;atk++;upcost=Math.ceil(upcost*1.65);say('강화 성공! 공격력 '+atk);render()}};$('auto').onclick=()=>{if(!auto&&gold>=100){gold-=100;auto=true;say('자동 공격 시작!');render()}};$('double').onclick=()=>{if(!dbl&&gold>=250){gold-=250;dbl=true;say('골드 2배 활성화!');render()}};$('reset').onclick=()=>{if(confirm('정말 처음부터 다시 시작할까?')){gold=0;lv=1;atk=1;xp=0;kills=0;auto=false;dbl=false;upcost=15;spawn();say('새로운 모험 시작!')}};setInterval(()=>{if(auto)hit()},1000);spawn()})();
</script></body></html>
